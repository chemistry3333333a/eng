<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>말랑 캐릭터 시안</title>
<!-- 2026-10-26 사용자가 확인한 시안 (버리는 코드, 그림 기준으로만 사용) -->
<style>
:root{--surface-1:#f8fafc;--surface-2:#fff;--border:#e2e8f0;--border-strong:#cbd5e1;--border-accent:#3b82f6;--bg-accent:#dbeafe;--text-accent:#1d4ed8;--text-primary:#0f172a;--text-secondary:#64748b;--radius:8px}
body{font-family:sans-serif;max-width:720px;margin:16px auto;padding:0 16px;background:#fff}
.cw{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:1rem 0 .6rem}
.cc{background:var(--surface-1);border:0.5px solid var(--border);border-radius:12px;padding:6px 4px 8px;text-align:center;cursor:pointer}
.cc.on{border:1.5px solid var(--border-accent)}
.cc p{margin:0;font-size:12px;color:var(--text-secondary)}
.dz{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.rw{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
.rw b{font-weight:500;font-size:12px;color:var(--text-secondary);width:34px;flex:none}
.rw button{font-size:12px;padding:4px 9px;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:var(--surface-2);color:var(--text-primary);cursor:pointer}
.rw button.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
.fl{animation:fl 2.2s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.ey{transform-box:fill-box;transform-origin:center;animation:bl 4s infinite}
@keyframes bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 1.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
.fa{animation:fa linear infinite}@keyframes fa{from{transform:translate(0,-40px)}to{transform:translate(14px,200px)}}
.ri{animation:ri linear infinite}@keyframes ri{from{transform:translateY(190px);opacity:0}15%{opacity:1}to{transform:translateY(-40px);opacity:0}}
.up{animation:up 2.4s ease-out infinite}@keyframes up{from{transform:translateY(10px);opacity:0}30%{opacity:1}to{transform:translateY(-26px);opacity:0}}
</style>
<div class="cw" id="row"></div>
<div class="dz"><div id="big" style="width:230px;flex:none"></div><div id="ctl" style="flex:1;min-width:300px"></div></div>
<script>
const C={bunny:{n:'솜사탕 토끼',f:'#fff4f7',l:'#e9a3b8',in:'#ffc2d4'},cat:{n:'버터 고양이',f:'#ffe3ad',l:'#d9a752',in:'#ffc9a8'},dog:{n:'구름 강아지',f:'#fffaf2',l:'#c9a27c',in:'#c8946a'},chick:{n:'삐약 병아리',f:'#ffe270',l:'#e0b22a',in:'#ffb347'}};
const G=[['ex','표정',{base:'기본',smile:'방긋',wink:'윙크',wow:'놀람',star:'반짝눈',love:'하트눈',sleep:'졸림',tongue:'메롱',teary:'울먹'}],
['hat','모자',{ribbon:'리본',crown:'왕관',flower:'꽃 화관',wizard:'마법사 모자',beret:'베레모'}],
['face','얼굴',{glasses:'동글 안경',heartg:'하트 안경',sticker:'별 스티커',bandaid:'반창고'}],
['hand','손',{wand:'별 지팡이',balloon:'풍선',icecream:'아이스크림',lolli:'막대사탕'}],
['back','등',{cape:'망토',angel:'천사 날개',butterfly:'나비 날개'}],
['fx','효과',{sparkle:'반짝반짝',hearts:'하트 퐁퐁',notes:'음표'}],
['bg','배경',{rainbow:'무지개 하늘',night:'별밤',sakura:'벚꽃 비',bubble:'비눗방울',snow:'눈 오는 날',meadow:'꽃밭'}]];
let cur='bunny',S={ex:'smile',hat:'ribbon',bg:'rainbow',fx:'sparkle'};
const D='#3d2a2e';
const hp=(x,y,s,f)=>`<path d="M${x} ${y+s}C${x-s*1.7} ${y-s*.1} ${x-s*.7} ${y-s*1.4} ${x} ${y-s*.45}C${x+s*.7} ${y-s*1.4} ${x+s*1.7} ${y-s*.1} ${x} ${y+s}Z" fill="${f}"/>`;
const sp=(x,y,r,f,k)=>{let p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;p.push((x+rr*Math.cos(a)).toFixed(1)+' '+(y+rr*Math.sin(a)).toFixed(1))}return `<path d="M${p.join('L')}Z" fill="${f}" stroke="${k||'none'}" stroke-width="1.5" stroke-linejoin="round"/>`};
const tw=(x,y,r,d,f)=>`<path class="tw" style="animation-delay:${d}s" d="M${x} ${y-r}Q${x} ${y} ${x+r} ${y}Q${x} ${y} ${x} ${y+r}Q${x} ${y} ${x-r} ${y}Q${x} ${y} ${x} ${y-r}Z" fill="${f}"/>`;
const arc=(x,up)=>`<path d="M${x-5} ${up?64:61}Q${x} ${up?56:67} ${x+5} ${up?64:61}" fill="none" stroke="${D}" stroke-width="2.6" stroke-linecap="round"/>`;
const dot=(x,r=1)=>`<ellipse cx="${x}" cy="62" rx="${4.2*r}" ry="${5.2*r}" fill="${D}"/><circle cx="${x+1.5}" cy="${60-r}" r="${1.7*r}" fill="#fff"/>`;
function face(ex,t){let e='',m='';const w=`<path d="M54 72Q57 76 60 72Q63 76 66 72" fill="none" stroke="${D}" stroke-width="1.8" stroke-linecap="round"/>`,op=`<path d="M53 70Q60 81 67 70Z" fill="#ff7a8a" stroke="${D}" stroke-width="1.8" stroke-linejoin="round"/>`;
switch(ex){case 'smile':e=arc(46,1)+arc(74,1);m=op;break;case 'wink':e=`<g class="ey">${dot(46)}</g>`+arc(74,1);m=w;break;
case 'wow':e=`<g class="ey">${dot(46,1.25)+dot(74,1.25)}</g>`;m=`<ellipse cx="60" cy="75" rx="3.6" ry="4.6" fill="${D}"/>`;break;
case 'star':e=sp(46,62,7,'#ffd54f',D)+sp(74,62,7,'#ffd54f',D);m=op;break;
case 'love':e=hp(46,61,5.5,'#ff4d7a')+hp(74,61,5.5,'#ff4d7a');m=op;break;
case 'sleep':e=arc(46,0)+arc(74,0);m=`<ellipse cx="60" cy="73" rx="2.5" ry="2" fill="${D}"/>`+`<path d="M92 20h7l-7 8h7M102 8h5l-5 6h5" fill="none" stroke="#7e9cd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;break;
case 'tongue':e=`<path d="M42 58L50 62L42 66M78 58L70 62L78 66" fill="none" stroke="${D}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`;m=`<path d="M53 70Q60 75 67 70" fill="none" stroke="${D}" stroke-width="1.8" stroke-linecap="round"/><path d="M56 72Q56 81 60 81Q64 81 64 72Z" fill="#ff8a9b" stroke="${D}" stroke-width="1.5"/>`;break;
case 'teary':e=`<g class="ey">${dot(46,1.2)+dot(74,1.2)}</g><circle cx="44" cy="64" r="1.3" fill="#fff"/><circle cx="72" cy="64" r="1.3" fill="#fff"/><path d="M40 68Q37 75 40 77Q43 75 40 68Z" fill="#8ecbff"/>`;m=`<path d="M53 75Q56.5 71 60 75Q63.5 71 67 75" fill="none" stroke="${D}" stroke-width="1.8" stroke-linecap="round"/>`;break;
default:e=`<g class="ey">${dot(46)+dot(74)}</g>`;m=w}
if(t==='chick')m=`<path d="M54 70L66 70L60 78Z" fill="#ffb347" stroke="#e08a1e" stroke-width="1.5" stroke-linejoin="round"/>`+(ex==='sleep'?`<path d="M92 20h7l-7 8h7M102 8h5l-5 6h5" fill="none" stroke="#7e9cd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`:'');
const bl=`<ellipse cx="37" cy="73" rx="7" ry="4.5" fill="#ff9fb5" opacity="${ex==='love'||ex==='teary'?.85:.6}"/><ellipse cx="83" cy="73" rx="7" ry="4.5" fill="#ff9fb5" opacity="${ex==='love'||ex==='teary'?.85:.6}"/>`;
return e+bl+m}
function back(k){if(k==='cape')return `<path d="M36 90Q60 82 84 90L98 140Q60 150 22 140Z" fill="#b39ddb" stroke="#7e67b8" stroke-width="2"/>`;
if(k==='angel'){const w=`<path d="M40 100Q14 74 4 92Q8 100 16 100Q6 106 12 114Q20 118 26 114Q22 122 32 122Q40 118 42 110Z" fill="#fff" stroke="#9ec9ee" stroke-width="2" stroke-linejoin="round"/>`;return w+`<g transform="translate(120 0) scale(-1 1)">${w}</g>`}
if(k==='butterfly'){const w=`<ellipse cx="22" cy="94" rx="17" ry="14" fill="#d7b8ff" stroke="#9a72d6" stroke-width="2"/><ellipse cx="26" cy="118" rx="11" ry="9" fill="#ffc2e0" stroke="#d47aa8" stroke-width="2"/><circle cx="20" cy="92" r="4" fill="#fff" opacity=".7"/>`;return w+`<g transform="translate(120 0) scale(-1 1)">${w}</g>`}return ''}
function hat(k){if(k==='crown')return `<path d="M42 24L40 4L51 14L60-2L69 14L80 4L78 24Z" fill="#ffd54f" stroke="#d4a017" stroke-width="2" stroke-linejoin="round"/><circle cx="60" cy="16" r="3" fill="#ff7aa2"/><circle cx="48" cy="19" r="2" fill="#7ec8ff"/><circle cx="72" cy="19" r="2" fill="#7ec8ff"/>`;
if(k==='ribbon')return `<g transform="translate(84 28)"><path d="M0 0L-13-9L-13 9ZM0 0L13-9L13 9Z" fill="#ff8fb1" stroke="#e0607f" stroke-width="2" stroke-linejoin="round"/><circle r="4.5" fill="#ff6f99" stroke="#e0607f" stroke-width="1.5"/></g>`;
if(k==='flower'){let o='',cs=['#ff9fc0','#fff','#c9a8ff','#ffd36b','#ff9fc0','#fff','#c9a8ff'];for(let i=0;i<7;i++){const a=(-160+i*23.3)*Math.PI/180,x=60+39*Math.cos(a),y=58+39*Math.sin(a);o+=`<ellipse cx="${(x+4).toFixed(1)}" cy="${(y+3).toFixed(1)}" rx="4" ry="2.4" fill="#8fd18a"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5.5" fill="${cs[i]}" stroke="#e39ab5" stroke-width="1.2"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2" fill="#ffc94d"/>`}return o}
if(k==='wizard')return `<path d="M32 26Q60 34 88 26L66-12Q60-20 56-10Z" fill="#7a6fd6" stroke="#4f45a8" stroke-width="2" stroke-linejoin="round"/><ellipse cx="60" cy="27" rx="34" ry="6" fill="#7a6fd6" stroke="#4f45a8" stroke-width="2"/>${sp(58,8,5,'#ffe066')}${sp(70,18,3.5,'#ffe066')}`;
if(k==='beret')return `<ellipse cx="52" cy="24" rx="32" ry="11" fill="#ff7a6b" stroke="#d4503f" stroke-width="2" transform="rotate(-8 52 24)"/><rect x="50" y="9" width="4" height="7" rx="2" fill="#d4503f"/>`;return ''}
function fc(k){if(k==='glasses')return `<g fill="#ffffff" fill-opacity=".25" stroke="#8d5a3b" stroke-width="2.2"><circle cx="46" cy="62" r="9.5"/><circle cx="74" cy="62" r="9.5"/></g><path d="M55.5 61Q60 58 64.5 61" fill="none" stroke="#8d5a3b" stroke-width="2.2"/>`;
if(k==='heartg')return `<g opacity=".9">${hp(46,62,8.5,'#ff5c8a')+hp(74,62,8.5,'#ff5c8a')}</g><path d="M54 60Q60 57 66 60" fill="none" stroke="#c23a63" stroke-width="2"/>`;
if(k==='sticker')return sp(86,64,6.5,'#ffe066','#e0b22a');
if(k==='bandaid')return `<g transform="rotate(-25 36 46)"><rect x="26" y="42" width="20" height="8" rx="4" fill="#f5c9a0" stroke="#d99b66" stroke-width="1.2"/><rect x="33" y="43" width="6" height="6" fill="#e8b48a"/></g>`;return ''}
function hand(k){if(k==='wand')return `<path d="M88 112L104 82" stroke="#a1887f" stroke-width="3.5" stroke-linecap="round"/>${sp(104,76,10,'#ffe066','#e0b22a')}`;
if(k==='balloon')return `<path d="M88 110Q98 92 104 64" fill="none" stroke="#999" stroke-width="1.2"/><ellipse cx="106" cy="48" rx="12" ry="14.5" fill="#ff8fb1" stroke="#e0607f" stroke-width="2"/><ellipse cx="102" cy="42" rx="3" ry="5" fill="#fff" opacity=".6"/><path d="M103 62L109 62L106 65Z" fill="#e0607f"/>`;
if(k==='icecream')return `<path d="M89 96L103 96L96 118Z" fill="#f2c27b" stroke="#c98f3c" stroke-width="1.8" stroke-linejoin="round"/><circle cx="96" cy="91" r="7.5" fill="#ffb3c7" stroke="#e0789a" stroke-width="1.8"/><circle cx="96" cy="81" r="6.5" fill="#b5f0d5" stroke="#5fbf96" stroke-width="1.8"/>`;
if(k==='lolli')return `<path d="M88 112L99 88" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/><path d="M88 112L99 88" stroke="#ccc" stroke-width="1" /><circle cx="101" cy="80" r="11" fill="#ffd6ec" stroke="#e0607f" stroke-width="2"/><path d="M101 80m-7 0a7 7 0 1 1 7 7a4 4 0 1 1 4-4" fill="none" stroke="#ff6f99" stroke-width="2.4" stroke-linecap="round"/>`;return ''}
function fx(k){if(k==='sparkle')return [[12,30,0],[110,36,.5],[14,96,.9],[106,120,.3]].map(([x,y,d])=>tw(x,y,7,d,'#ffd54f')).join('');
if(k==='hearts')return [[14,80,0,4],[106,70,.8,5],[20,40,1.5,3.5],[100,110,1.1,3]].map(([x,y,d,s])=>`<g class="up" style="animation-delay:${d}s">${hp(x,y,s,'#ff6f99')}</g>`).join('');
if(k==='notes')return [[12,70,0,'#7e9cd8'],[106,52,.7,'#b39ddb'],[104,104,1.4,'#7fcfa8']].map(([x,y,d,c])=>`<g class="up" style="animation-delay:${d}s"><ellipse cx="${x}" cy="${y}" rx="4" ry="3" fill="${c}" transform="rotate(-20 ${x} ${y})"/><path d="M${x+3.5} ${y-1}V${y-14}l6 3" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"/></g>`).join('');return ''}
function bgd(k){const R=(f)=>`<rect x="-20" y="-24" width="160" height="180" fill="${f}"/>`;let o='';
if(k==='rainbow'){o=R('#e3f3ff');['#ffb3b3','#ffd9a3','#fff1a3','#c4f0b8','#b8dcff','#d4c4ff'].forEach((c,i)=>o+=`<path d="M-10 120A70 70 0 0 1 130 120" fill="none" stroke="${c}" stroke-width="7" opacity=".9" style="transform-origin:60px 120px;transform:scale(${1-i*.1})"/>`);o+=`<g fill="#fff"><circle cx="-4" cy="118" r="12"/><circle cx="10" cy="122" r="10"/><circle cx="122" cy="118" r="12"/><circle cx="108" cy="122" r="10"/></g>`}
if(k==='night'){o=R('#2e3166')+`<circle cx="112" cy="-2" r="12" fill="#fff3b0"/><circle cx="118" cy="-6" r="11" fill="#2e3166"/>`;[[-8,10,0],[20,-12,.4],[100,30,.8],[-4,60,1.2],[128,80,.2],[30,20,1],[90,-14,.6],[-10,120,.9],[126,130,1.3]].forEach(([x,y,d])=>o+=tw(x,y,4,d,'#fff6c2'))}
if(k==='sakura'){o=R('#fff0f5');for(let i=0;i<10;i++)o+=`<g class="fa" style="animation-duration:${4+i%3}s;animation-delay:-${i*.55}s"><ellipse cx="${-14+i*16}" cy="0" rx="4" ry="2.6" fill="#ffb7cf" transform="rotate(${i*40} ${-14+i*16} 0)"/></g>`}
if(k==='bubble'){o=R('#e0f7fa');for(let i=0;i<8;i++)o+=`<g class="ri" style="animation-duration:${5+i%3}s;animation-delay:-${i*.8}s"><circle cx="${-12+i*20}" cy="0" r="${4+i%3*3}" fill="#fff" fill-opacity=".4" stroke="#7fd3e6" stroke-width="1.2"/></g>`}
if(k==='snow'){o=R('#dde8f5');for(let i=0;i<14;i++)o+=`<g class="fa" style="animation-duration:${5+i%4}s;animation-delay:-${i*.45}s"><circle cx="${-16+i*11}" cy="0" r="${1.6+i%3}" fill="#fff"/></g>`;o+=`<ellipse cx="60" cy="160" rx="110" ry="24" fill="#fff"/>`}
if(k==='meadow'){o=R('#e6f6ff')+`<ellipse cx="60" cy="168" rx="120" ry="40" fill="#bfe8a6"/>`;[[-8,140,'#ff9fc0'],[12,150,'#fff'],[108,142,'#ffd36b'],[126,152,'#c9a8ff'],[90,154,'#ff9fc0']].forEach(([x,y,c])=>o+=`<circle cx="${x}" cy="${y}" r="4" fill="${c}"/><circle cx="${x}" cy="${y}" r="1.5" fill="#ffc94d"/>`)}return o}
function draw(t,s,id){const c=C[t],st=`stroke="${c.l}" stroke-width="2.2"`;let o=back(s.back);
if(t==='bunny')o+=`<g ${st} fill="${c.f}"><ellipse cx="44" cy="10" rx="10" ry="26" transform="rotate(-10 44 10)"/><ellipse cx="76" cy="10" rx="10" ry="26" transform="rotate(10 76 10)"/></g><ellipse cx="44" cy="12" rx="4.5" ry="17" fill="${c.in}" transform="rotate(-10 44 12)"/><ellipse cx="76" cy="12" rx="4.5" ry="17" fill="${c.in}" transform="rotate(10 76 12)"/>`;
if(t==='cat')o+=`<g ${st} fill="${c.f}" stroke-linejoin="round"><path d="M28 44L32 8L56 26Z"/><path d="M92 44L88 8L64 26Z"/></g><path d="M33 34L35 17L47 27Z" fill="${c.in}"/><path d="M87 34L85 17L73 27Z" fill="${c.in}"/>`;
if(t==='chick')o+=`<path d="M58 22Q52 6 60 4Q60 14 64 8Q66 16 62 22" fill="${c.f}" ${st}/>`;
o+=`<g ${st} fill="${c.f}"><ellipse cx="47" cy="132" rx="9" ry="6"/><ellipse cx="73" cy="132" rx="9" ry="6"/><ellipse cx="60" cy="112" rx="26" ry="22"/><ellipse cx="35" cy="108" rx="7" ry="10" transform="rotate(25 35 108)"/><ellipse cx="85" cy="108" rx="7" ry="10" transform="rotate(-25 85 108)"/></g><ellipse cx="60" cy="116" rx="14" ry="11" fill="#fff" opacity=".55"/><circle cx="60" cy="58" r="40" fill="${c.f}" ${st}/>`;
if(t==='cat')o+=`<g stroke="${c.l}" stroke-width="2.5" stroke-linecap="round"><path d="M54 22V30M60 20V30M66 22V30"/></g>`;
if(t==='dog')o+=`<ellipse cx="74" cy="60" rx="13" ry="12" fill="#f3dcc2"/><g ${st} fill="${c.in}"><ellipse cx="25" cy="58" rx="11" ry="22" transform="rotate(18 25 58)"/><ellipse cx="95" cy="58" rx="11" ry="22" transform="rotate(-18 95 58)"/></g>`;
o+=face(s.ex,t)+fc(s.face)+hat(s.hat)+hand(s.hand)+fx(s.fx);
const ch=`<ellipse cx="60" cy="140" rx="34" ry="5" fill="#000" opacity=".1"/><g class="fl">${o}</g>`;
if(!id)return `<svg viewBox="-6 -24 132 172" width="100%" role="img" aria-label="${c.n}">${ch}</svg>`;
return `<svg viewBox="-20 -24 160 180" width="100%" role="img" aria-label="${c.n} 미리보기"><defs><clipPath id="${id}"><rect x="-20" y="-24" width="160" height="180" rx="14"/></clipPath></defs><g clip-path="url(#${id})">${bgd(s.bg)}${ch}</g><rect x="-19.5" y="-23.5" width="159" height="179" rx="14" fill="none" stroke="#000" stroke-opacity=".08"/></svg>`}
const demo={bunny:{ex:'smile'},cat:{ex:'wink'},dog:{ex:'love'},chick:{ex:'star'}};
function paint(){row.innerHTML=Object.keys(C).map(k=>`<div class="cc ${k===cur?'on':''}" data-k="${k}">${draw(k,demo[k])}<p>${C[k].n}</p></div>`).join('');
row.querySelectorAll('.cc').forEach(d=>d.onclick=()=>{cur=d.dataset.k;paint()});
big.innerHTML=draw(cur,S,'clipbg');
ctl.innerHTML=G.map(([g,lab,o])=>`<div class="rw"><b>${lab}</b>${Object.entries(o).map(([k,v])=>`<button class="${S[g]===k?'on':''}" data-g="${g}" data-k="${k}">${v}</button>`).join('')}</div>`).join('');
ctl.querySelectorAll('button').forEach(b=>b.onclick=()=>{const g=b.dataset.g,k=b.dataset.k;S[g]=S[g]===k&&g!=='ex'?null:k;paint()});}
paint();
</script>
